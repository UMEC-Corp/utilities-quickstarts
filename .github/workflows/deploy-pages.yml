# Publish to GitHub Pages (source: GitHub Actions).
# In the repository: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - develop
    paths:
      - "src/utilities-quickstarts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r src/utilities-quickstarts/requirements.txt

      - name: Build site
        run: python -m mkdocs build --strict --config-file src/utilities-quickstarts/mkdocs.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
